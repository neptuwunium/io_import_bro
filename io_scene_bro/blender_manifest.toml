schema_version = "1.0.0"

id = "io_scene_bro"
version = "1.3.1"
name = "BroEngine Import"
tagline = "3rd Party BroEngine Importer, optimized for HEAT"
maintainer = "neptuwunium"
type = "add-on"
tags = ["Import-Export"]
website = "https://github.com/neptuwunium/io_scene_bro"

blender_version_min = "5.1"

license = [
    "SPDX:EUPL-1.2",
]

[permissions]
files = "Importing files from disk"

[build]
paths_exclude_pattern = [
    ".*",
    "Thumbs.db",
    "__pycache__",
    "*.pyc",
    "*.pyi",
]
