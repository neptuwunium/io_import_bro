[project]
name = "io_scene_bro"
version = "1.1.0"
requires-python = "==3.13.*"

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "bpy==5.1.2",
    "mathutils==5.1.0",
    "fake-bpy-module",
]

[tool.uv.sources]
bpy = { index = "blender" }

[[tool.uv.index]]
name = "blender"
url = "https://download.blender.org/pypi/"

[tool.setuptools]
packages = ["io_scene_bro"]
